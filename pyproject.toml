# Tooling configuration only: this repository is not packaged or installed.
# Runtime and development dependencies are pinned in requirements*.txt.

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests", "api", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src", "api", "dashboard", "scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
