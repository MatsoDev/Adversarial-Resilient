[project]
name = "adversarial-resilient"
version = "0.1.0"
description = "Adversarial-Resilient Security Models (EMBER/CICIDS2017, ART/CleverHans, hardening)"
requires-python = ">=3.10,<3.13"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests", "api", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311"]
